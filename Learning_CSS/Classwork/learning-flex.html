<head>
<style>
.container {
  display: flex;
  background-color: rgb(53, 198, 234);
  flex-direction: column;
  gap: 20px;
} 

.container div {
  background-color: #ee6c20;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
</style>
</head>
<body>
<h1>Flex property :</h1>
<div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
  <div>Item 4</div>
  <div>Item 5</div>
<p>Flexbox must have a parent element with display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>
</body>
