<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html     { font-size: 16px; }   /* root */
.parent  { font-size: 20px; }

.em-text  { font-size: 2em; }   /* 2 × 20px (parent) = 40px */
.rem-text { font-size: 2rem; }  /* 2 × 16px (root)   = 32px */
    </style>
</head>
<body>
   <div class="parent">
  <p class="em-text">I use em</p>
  <p class="rem-text">I use rem</p>
</div>
</body>
</html>
