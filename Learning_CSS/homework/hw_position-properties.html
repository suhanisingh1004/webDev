<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  
.container {
  position: relative;
  text-align: center;
  color: rgb(57, 226, 111);
}

.bottom-left {
  position: absolute;
  bottom: 8px;
  left: 16px;
}

.top-left {
  position: absolute;
  top: 8px;
  left: 16px;
}

.top-right {
  position: absolute;
  top: 8px;
  right: 16px;
}

.top-center
{
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}
.bottom-right {
  position: absolute;
  bottom: 8px;
  right: 16px;
}
.bottom-center {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}
.centered {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.left_center {
  position: absolute;
  top: 50%;
  left: 8px;
  transform: translateY(-50%);
}
.right_center {
  position: absolute;
  top: 50%;
  right: 8px;
  transform: translateY(-50%);
}
</style>
</head>
<body>


<div class="container">
  <img src="WhatsApp Image 2026-10-06 at 13.36.18.jpeg" alt="image" width="1450" height="820">
  <div class="bottom-left" style="font-size: 24px;">Suhani Singh</div>
  <div class="top-left" style="font-size: 24px;">Suhani Singh</div>
  <div class="top-right" style="font-size: 24px;">Suhani Singh</div>
  <div class="bottom-right" style="font-size: 24px;">Suhani Singh</div>
  <div class="centered" style="font-size: 24px;">Suhani Singh</div>
  <div class="top-center" style="font-size: 24px;">Suhani Singh</div>
  <div class="bottom-center" style="font-size: 24px;">Suhani Singh</div>
  <div class="left_center" style="font-size: 24px;">Suhani Singh</div>
  <div class="right_center" style="font-size: 24px;">Suhani Singh</div>
 
</div>

</body>
</html>
