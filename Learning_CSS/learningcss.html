<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <style>
        p {
            color: rgb(240, 30, 30);
            font-size: 20px;

            background: hotpink;
        }

        #intro {
            color: purple;
            font-size: 20px;

            color: rgb(92, 70, 205) !important;

            width: 300px;

            border: 2px solid black;
            padding: 20px;
            margin: 20px;
            box-sizing: border-box;
        }
        div  p {
            color:yellow;
        }
        div + div p {
            color: red;
        }
    </style>

</head>
